name: VulnShield-DNN CI & Scientific Verification

on:
  push:
    branches: [ main, master, dev, "feat/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Test Suite & Scientific Verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install pytest pytest-cov flake8 scipy

      - name: Verify Directory Governance & Integrity
        run: |
          python scripts/setup/verify_project_structure.py

      - name: Code Quality & Linting Check
        run: |
          # Stop build on syntax errors or undefined names
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning check for PEP8 conformance
          flake8 src/ tests/ --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Execute Full Scientific Test Suite with Coverage
        run: |
          python -m pytest tests/ -v --tb=short --cov=src/vulnshield --cov-report=term-missing

      - name: Validate Scientific Invariants
        run: |
          python -c "
          from vulnshield.validation.result_validator import validate_discovery_result, ResultValidationError
          result = {'top_channels': [{'delta_accuracy': 5.0, 'layer_name': 'l', 'channel_idx': 0}], 'total_queries_executed': 50, 'max_budget_enforced': 50}
          validate_discovery_result(result, budget=50)
          print('[PASS] Result validator: discovery schema OK')
          "

      - name: Verify No Hardcoded Empirical Constants (93.2, 76.4, 88.5)
        run: |
          python -c "
          import subprocess, sys
          result = subprocess.run(['grep', '-rn', '93\.2\|76\.4\|88\.5\|92\.8', 'src/vulnshield/', '--include=*.py'], capture_output=True, text=True)
          hits = [l for l in result.stdout.splitlines() if 'test' not in l.lower()]
          if hits:
              print('[FAIL] Hardcoded empirical values detected in src/:')
              print('\n'.join(hits))
              sys.exit(1)
          else:
              print('[PASS] No hardcoded empirical constants in source code.')
          "

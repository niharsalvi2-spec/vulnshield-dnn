# Publication-Grade Full Research Configuration for VulnShield-DNN.
#
# THIS IS THE OFFICIAL RESEARCH CONFIGURATION.
# All reported results in publications must originate from this configuration.
#
# Experiment settings are FROZEN as of this commit.
# Any deviation must be documented and version-controlled.

project:
  name: "vulnshield-dnn"
  seed: 42
  mode: "RESEARCH"

dataset:
  name: "cifar10"
  n_train: 40000     # Official CIFAR-10 train split
  n_val: 5000        # Validation split (disjoint from test)
  n_test: 5000       # Test split (reserved for final evaluation only)
  n_eval_fault: 1000 # EvalFault split (disjoint, used for RL calibration only)
  batch_size: 128

models:
  - name: "resnet18"
    config: "configs/models/resnet18_cifar10.yaml"
  - name: "vgg16"
    config: "configs/models/vgg16_cifar10.yaml"

training:
  epochs: 200
  optimizer: "sgd"
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  scheduler: "cosine"

discovery:
  # N_queries = 50 for ALL methods — strictly enforced
  query_budget: 50
  seeds:
    - 42
    - 123
    - 456
    - 789
    - 999

baselines:
  - "random"
  - "activation"
  - "gradient"
  - "ddpg"

interaction:
  max_pairs: 200
  synergy_threshold: 1.0   # ΔA > +1% = compounding
  masking_threshold: -1.0  # ΔA < -1% = masking

protection:
  budgets:
    - 0.01    # 1% of total channels protected
    - 0.03    # 3%
    - 0.05    # 5%
    - 0.10    # 10%
  epochs: 50
  clean_accuracy_constraint: 0.99  # Protected >= 99% of baseline clean acc

evaluation:
  fgsm_epsilon: 0.031372  # 8/255
  pgd_epsilon: 0.031372
  pgd_alpha: 0.007843     # 2/255
  pgd_steps: 20
  bit_flip_per_layer: 10
  bit_types:
    - "sign"
    - "exponent"
    - "mantissa"

statistical:
  confidence_level: 0.95
  multiple_comparison: "holm_bonferroni"
  min_seeds_for_significance: 3

research:
  mode: "RESEARCH"
  label: "OFFICIAL RESEARCH CONFIGURATION — Results are publication-grade"
  frozen_at: "2026-08-28"

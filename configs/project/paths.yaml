    metadata: "{project_root}/data/metadata"
    channel_catalogs: "{project_root}/data/metadata/channel_catalogs"
    
  checkpoints:
    base_models: "{project_root}/checkpoints/base_models"
    td3: "{project_root}/checkpoints/td3"
    ddpg: "{project_root}/checkpoints/ddpg"
